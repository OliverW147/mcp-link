plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = project.archives_base_name
    version = project.mod_version
    group = project.maven_group
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    // 26.x ships de-obfuscated, so Loom uses identity mappings and no `mappings` line is allowed.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // optional: only for the config button in Mod Menu
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // JavaScript engine for in-game scripts, shipped inside the mod jar
    implementation "org.mozilla:rhino:${project.rhino_version}"
    include "org.mozilla:rhino:${project.rhino_version}"
    // decompiler for the source tool (the same one Loom uses for genSources)
    implementation "org.vineflower:vineflower:${project.vineflower_version}"
    include "org.vineflower:vineflower:${project.vineflower_version}"
}

processResources {
    def props = [version: project.version, loader_version: project.loader_version]
    inputs.properties props
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
